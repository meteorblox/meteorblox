name: Sui Move checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sui-move-${{ github.ref }}
  cancel-in-progress: true

jobs:
  move:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUIUP_INSTALL_DIR: /tmp/meteorblox-suiup
      SUIUP_DEFAULT_BIN_DIR: /tmp/meteorblox-sui-bin

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Sui Testnet CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/MystenLabs/suiup/main/install.sh | sh
          "${SUIUP_INSTALL_DIR}/suiup" install sui@testnet -y
          "${SUIUP_DEFAULT_BIN_DIR}/sui" --version

      - name: Build Move package
        run: "${SUIUP_DEFAULT_BIN_DIR}/sui move build"

      - name: Generate upgrade payload
        run: |
          "${SUIUP_DEFAULT_BIN_DIR}/sui" move build --dump-bytecode-as-base64 --no-tree-shaking --silence-warnings > /tmp/upgrade-output.txt
          grep '^{"modules"' /tmp/upgrade-output.txt > /tmp/upgrade-data.json
          test -s /tmp/upgrade-data.json

      - name: Upload upgrade payload
        uses: actions/upload-artifact@v4
        with:
          name: compatible-upgrade-data
          path: /tmp/upgrade-data.json

      - name: Update app upgrade payload
        if: github.event_name == 'pull_request'
        run: |
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/upgrade-data.json','utf8')); fs.writeFileSync('web/app/upgrade-data.ts', '// Generated by scripts/generate-upgrade-data.mjs.\\nexport const upgradeData = '+JSON.stringify(data)+' as const;\\n')"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- web/app/upgrade-data.ts
          if ! git diff --cached --quiet; then
            git commit -m "Generate compatible random autoplay payload"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Run Move unit tests
        run: "${SUIUP_DEFAULT_BIN_DIR}/sui move test"

      - name: Run Sui Move linter
        run: "${SUIUP_DEFAULT_BIN_DIR}/sui move lint"
